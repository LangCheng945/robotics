<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全國技藝競賽 機器人學模擬測驗系統 | HCVS</title>
    <style>
        :root {
            /* 建議可以將這裡改成 HCVS 的學校代表色 */
            --primary-color: #003366; 
            --accent-color: #f39c12; /* 點綴色：金黃色代表金手獎 Latest:Q158 */
            --bg-color: #f4f7f6;
            --paper-color: #ffffff;
            --text-color: #333333;
            --correct-color: #28a745;
            --wrong-color: #dc3545;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 5px;
        }
        h2.subtitle {
            color: var(--accent-color);
            text-align: center;
            font-size: 1.2em;
            margin-top: 0;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--paper-color);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border-top: 4px solid var(--primary-color);
        }
        .setup-section {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border-top: none; /* 覆蓋預設的上方邊框 */
        }
        input[type="number"] {
            padding: 8px;
            width: 80px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        button:hover {
            background-color: #002244;
        }
        .question-block {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #ccc;
        }
        .question-text {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .options label {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .options label:hover {
            background-color: #e9ecef;
        }
        .options input[type="radio"] {
            margin-right: 10px;
        }
        .result-msg {
            font-weight: bold;
            margin-top: 10px;
            display: none;
            padding: 10px;
            border-radius: 4px;
        }
        .correct { background-color: #d4edda; color: var(--correct-color); border-left: 4px solid var(--correct-color); }
        .wrong { background-color: #f8d7da; color: var(--wrong-color); border-left: 4px solid var(--wrong-color); }
        #scoreBoard {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            color: var(--primary-color);
            display: none;
        }
        #quizContainer { display: none; }
    </style>
</head>
<body>

    <h1>🏆 全國技藝競賽 機器人學模擬測驗</h1>
    <h2 class="subtitle">HCVS 選手專屬備戰平台 • 邁向金手獎 Ver 6.5.158</h2>

    <div class="card setup-section" id="setupSection">
        <label for="numQuestions">請選擇本次訓練要抽取的題數：</label>
        <input type="number" id="numQuestions" value="20" min="1">
        <button onclick="startQuiz()">開始特訓</button>
    </div>

    <div class="card" id="scoreBoard"></div>

    <div class="card" id="quizContainer">
        <div id="questionsList"></div>
        <button id="submitBtn" onclick="submitQuiz()" style="width: 100%; margin-top: 20px; font-size: 1.2em; background-color: var(--accent-color); color: #fff;">交卷並計算分數</button>
        <button id="retryBtn" onclick="location.reload()" style="width: 100%; margin-top: 10px; background-color: #6c757d; display: none;">重新開始新的一局</button>
    </div>

    <script>
        // ---------------------------------------------------------
        // 👇 題庫建檔區 👇
        // 請將技藝競賽的歷屆試題依照下方格式放入
        // ans 代表正確答案的索引值 (0=A, 1=B, 2=C, 3=D)
        // ---------------------------------------------------------
        const questionBank = [
    { q: "1. 多軸關節式機器人(機器手臂)的特點是高自由度與靈活性...試問下列何者適合以並聯式機器人來開發？", options: ["(A) 汽車板金噴漆", "(B) 食品自動化整列", "(C) 手機外殼去毛邊及拋光", "(D) 汽車底盤焊接"], ans: 1 },
    { q: "2. 下列何種感測器可以測距離？", options: ["(A) 超音波感測器", "(B) 紅外線感測器", "(C) 雷射光感測器", "(D) 以上皆是"], ans: 3 },
    { q: "3. 下列何種通訊方式不屬於無線傳輸？", options: ["(A) Wi-Fi", "(B) Bluetooth 藍芽", "(C) ZigBee", "(D) RS232"], ans: 3 },
    { q: "4. 下列何者不屬於感測器？", options: ["(A) 陀螺儀(Gyroscope)", "(B) 光敏電阻(CdS)", "(C) LED燈", "(D) 加速度計"], ans: 2 },
    { q: "5. Boe-Bot(BB Car)自走車是一款機器人套件...下列何者是屬於自走車中致動器的部分？", options: ["(A) 微處理器", "(B) 馬達", "(C) 蜂鳴器", "(D) 紅外線頭燈"], ans: 1 },
    { q: "6. Boe-Bot(BB Car)自走車是一款機器人套件...下列何者是屬於自走車中控制單元(Control Unit)的部分？", options: ["(A) 微處理器", "(B) 馬達", "(C) 蜂鳴器", "(D) 紅外線頭燈"], ans: 0 },
    { q: "7. Boe-Bot(BB Car)自走車是一款機器人套件...MHz為微處理器其中一個性能指標，試問 MHz 代表的意義為？", options: ["(A) 每秒執行指令數", "(B) 每秒系統執行浮點運算數", "(C) 時脈(Clock Speed)", "(D) 運作電壓"], ans: 2 },
    { q: "8. 考量強度有些機器人的機體材質使用金屬構成，就會有重量的問題...試問下列哪一項是挑選馬達的主要因素？", options: ["(A) 精度", "(B) 功耗", "(C) 體積", "(D) 扭力"], ans: 3 },
    { q: "9. iRobot 家用吸塵機器人平均25坪大小需要花一小時清理，所需功率為33Wh...試問要選以下何種規格的電池可以確保完成清潔作業？", options: ["(A) 14.4V/3500mAH", "(B) 14.4V/3000mAH", "(C) 22.2V/1500mAH", "(D) 14.8V/4400mAH"], ans: 3 },
    { q: "10. 下列何種通訊技術的功耗最低？", options: ["(A) Wi-Fi", "(B) Bluetooth", "(C) ZigBee", "(D) UWB"], ans: 2 },
    { q: "11. ADXL345 為一個三維加速度計...當一物體以0.01g之加速度移動10秒，結果得到有5公分的誤差，試問其環境溫差為多少？ (g=10 m/s²)", options: ["(A) 1", "(B) 10", "(C) 100", "(D) 1000℃"], ans: 2 },
    { q: "12. Pepper是一款服務型機器人...以下何者算是服務型機器人？", options: ["(A) 保全機器人", "(B) 清潔機器人", "(C) 導覽機器人", "(D) 以上皆是"], ans: 3 },
    { q: "13. 承上題，機器人在進行人臉表情辨識以及語音辨識時需要下列哪兩樣元件？", options: ["(A) 雷射測距/聲納", "(B) 攝影機/聲納", "(C) 攝影機/高感度麥克風", "(D) 觸碰感測器/陀螺儀"], ans: 2 },
    { q: "14. 承上題，要得到機器人當前的姿態需要下列哪兩樣元件？", options: ["(A) 觸碰感測器/陀螺儀", "(B) 觸碰感測器/聲納", "(C) 陀螺儀/加速度計", "(D) 聲納/加速度計"], ans: 2 },
    { q: "15. 下列哪一個作業系統不屬於嵌入式作業系統？", options: ["(A) Linux", "(B) Windows CE", "(C) Windows 10", "(D) VxWorks"], ans: 2 },
    { q: "16. 機械手臂的終端點定位維度為？", options: ["(A) 3", "(B) 4", "(C) 5", "(D) 6"], ans: 3 },
    { q: "17. 定位精度為機器人控制系統能夠分辨出差異的最小工作空間位置控制增量變化。機器人的定位精度與下列何者沒有直接的關係？", options: ["(A) 伺服控制器", "(B) 機械構造及材料特性", "(C) 位置感測器", "(D) 機器人程式語言"], ans: 3 },
    { q: "18. 6軸機械手臂的哪一軸可旋轉大於360度？", options: ["(A) 第1軸", "(B) 第6軸", "(C) 第2軸", "(D) 以上皆非"], ans: 1 },
    { q: "19. 令L代表直線平移以及R代表旋轉關節，3軸SCARA 機械臂之運動自由度為下列何者機械結構？", options: ["(A) L³", "(B) L^∞", "(C) LLR²", "(D) R³"], ans: 2 },
    { q: "20. 令L代表直線平移以及R代表旋轉關節，通常工業用6軸機械臂之運動自由度為下列何者機械結構？", options: ["(A) R³L³", "(B) R⁴L²", "(C) R⁵L", "(D) R⁶"], ans: 3 },
    { q: "21. 機器人系統之時間週期為往返工作空間特定垂直高度或特定水平距離的時間。下列何種機器人有最短的時間週期？", options: ["(A) 直角座標", "(B) 圓柱座標", "(C) 並聯式", "(D) 關節型機器人"], ans: 2 },
    { q: "22. 下列何種機器人之中有最大的工作空間與佔用空間比？", options: ["(A) 直角座標", "(B) 圓柱座標", "(C) 並聯式", "(D) 關節式機器手臂"], ans: 3 },
    { q: "23. 市面上6軸機械手臂的減速機減速比為何？", options: ["(A) 1:20", "(B) 1:100", "(C) 1:50", "(D) 1:200"], ans: 1 },
    { q: "24. 下列何者不是關節型機器手臂的優點？", options: ["(A) 最佳的剛性與定位精度", "(B) 最大的工作空間與佔用空間比", "(C) 適用的搬運負荷與機器人重量之比值", "(D) 安裝方式最多元，可置於檯面、吊掛、壁掛"], ans: 0 },
    { q: "25. 以下哪項是正確的？", options: ["(A) 額定荷重就是最大荷重", "(B) 額定荷重值因機器人的伸展姿態不同而有變化", "(C) 額定荷重大小與荷重重心相對於腕中心點的距離有關", "(D) 額定荷重是指機器人在初始位置時的最大荷重"], ans: 2 },
    { q: "26. 對六軸機器人言，通常不能旋轉達到360度的軸是", options: ["(A) 第一軸", "(B) 第四軸", "(C) 第五軸", "(D) 第六軸"], ans: 2 },
    { q: "27. 在安全操作模式下，機器人的最大移動速度為", options: ["(A) 300", "(B) 250", "(C) 200", "(D) 150 mm/s"], ans: 1 },
    { q: "28. 市售工業用機器人一般基本配置包含", options: ["(A) 機械臂", "(B) 機械臂/控制器/夾爪", "(C) 機械臂/控制器/操作電腦", "(D) 機械臂/控制器/教導器"], ans: 3 },
    { q: "29. 在空間進行焊接用的機器人至少需要幾個自由度(DOF)？", options: ["(A) 4", "(B) 5", "(C) 6", "(D) 7"], ans: 1 },
    { q: "30. 在生產線進行水平裝配機器人通常需要具備幾個自由度(DOF)？", options: ["(A) 3", "(B) 4", "(C) 5", "(D) 6"], ans: 1 },
    { q: "31. 設備防護等級 IP(Ingress Protection) 30表示", options: ["(A) 第一個字代表防塵等級", "(B) 第二個字代表防水等級", "(C) 無論第一或第二數字，數值越大防護功能越好", "(D) 以上皆對"], ans: 3 },
    { q: "32. 以下何者正確？", options: ["(A) 腕中心與機器人第一軸線的距離是機器人最大可達半徑", "(B) 最後一軸法蘭面中心與機器人第一軸線的距離是機器人最大可達半徑", "(C) 因為安全緣故，機器人工作空間不會低於機器人的底座平面", "(D) 以上皆錯"], ans: 0 },
    { q: "33. 機器人一般在定位的表現上採用", options: ["(A) 重複精度(Repeatability)", "(B) 準確度(Accuracy)", "(C) 精確度(Precision)", "(D) 無特定的用詞"], ans: 0 },
    { q: "34. 工業機器人", options: ["(A) 最後一軸法蘭面都會提供定位孔及固定孔", "(B) 教導盒的主要功用是方便手動操作機器人", "(C) 機器人控制器一定都會有外部連接埠以方便程序控制", "(D) 以上皆正確"], ans: 3 },
    { q: "35. 請問哪一項最可能是噴漆機器人的防護等級？", options: ["(A) IP67", "(B) IP30", "(C) IP02", "(D) IP22"], ans: 0 },
    { q: "36. 請問哪一項是正確的？", options: ["(A) 一般而言，串列機器人比平行機器人有較大的工作空間", "(B) 平行機器人有高剛性", "(C) SCARA 機器人適合產線裝配", "(D) 以上皆正確"], ans: 3 },
    { q: "37. 請問工業機器人規格中不一定有的項目是？", options: ["(A) 荷重", "(B) 位置重複精度", "(C) 功用", "(D) 關節最大速率"], ans: 2 },
    { q: "38. 機器人有時需要七個自由度，哪項不是實際考量的原因？", options: ["(A) 擴大作業空間", "(B) 避開障礙物", "(C) 可不必所有關節皆須同步運動，安全考量", "(D) 避免某一軸故障時仍有足夠的自由度可用"], ans: 3 },
    { q: "39. 工業機器人有哪些驅動器？", options: ["(A) 馬達", "(B) 油壓", "(C) 氣壓", "(D) 以上皆正確"], ans: 3 },
    { q: "40. 以下何項不屬於機器人規格項目？", options: ["(A) 最大負重", "(B) 重現性", "(C) 準確度", "(D) 夾爪"], ans: 3 },
    { q: "41. 以下何者是機器人路徑設定之方法？", options: ["(A) 教點設定路徑", "(B) 機器人語言程式", "(C) 離線程式", "(D) 以上皆是"], ans: 3 },
    { q: "42. 對6自由度關節型機械臂以下何者正確？", options: ["(A) 是一種並聯式之機構", "(B) 不適用卡式空間之程式", "(C) 可執行空間中點對點之軌跡", "(D) 以上皆是"], ans: 2 },
    { q: "43. 機器人與攝影機整合運作，下列哪一項正確？", options: ["(A) 攝影機可安裝於機器人終端效應器上", "(B) 攝影機可安裝於機器人外部", "(C) 攝影機可安裝於機器人手臂上", "(D) 以上皆是"], ans: 3 },
    { q: "44. 以下何者是機械臂校正之目的？", options: ["(A) 為了要安裝攝影機", "(B) 為了提升運動精確度", "(C) 為了提升運動速度", "(D) 以上皆是"], ans: 1 },
    { q: "45. 以下有關 Delta 機械臂，何者正確？", options: ["(A) 有較高之加速度", "(B) 有較少之馬達", "(C) 有較大之工作空間", "(D) 以上皆非"], ans: 0 },
    { q: "46. 以下有關輪式機器人，何者正確？", options: ["(A) 可採用兩獨立驅動輪的結構", "(B) 可採用單輪驅動及轉向之機構", "(C) 可採用三全向輪之機構", "(D) 以上皆是"], ans: 3 },
    { q: "47. 請問下列何者為機器人程式命令內容？", options: ["(A) 直線運動", "(B) 圓弧運動", "(C) 點到點運動", "(D) 以上皆是"], ans: 3 },
    { q: "48. 以下何者屬於機械臂抓物之方法？", options: ["(A) 基於影像辨識", "(B) 使用電動夾爪", "(C) 使用夾治具", "(D) 以上皆是"], ans: 3 },
    { q: "49. 請問下列何者適合做為機器人控制器？", options: ["(A) PC-Based", "(B) EtherCAT 架構", "(C) 嵌入式系統", "(D) 以上皆是"], ans: 3 },
    { q: "50. 多軸關節型機械臂能重複到達某特定姿態的能力稱為", options: ["(A) 精確度", "(B) 重現性", "(C) 適應性", "(D) 以上皆非"], ans: 1 },
    { q: "51. 以下何者不屬於智慧機器人之範疇？", options: ["(A) 最高轉速", "(B) 環境辨識", "(C) 力回饋控制", "(D) 以上皆是"], ans: 0 },
    { q: "52. 以下何者不屬於減速機對機器人規格之重要性？", options: ["(A) 提供關節高轉矩", "(B) 避免齒輪背隙", "(C) 提高速度", "(D) 以上皆非"], ans: 2 },
    { q: "53. 對服務型機器人之應用何者不正確？", options: ["(A) 軍事用途", "(B) 家庭清潔", "(C) 農業用途", "(D) 以上皆非"], ans: 3 },
    { q: "54. ISO 13482 規範機器人何種項目？", options: ["(A) 做為個人照護機器人安全防護之標準", "(B) 機器人取物速度", "(C) 控制法則之運用", "(D) 以上皆是"], ans: 0 },
    { q: "55. 下列何者是移動式機器人移動平台設計的最關鍵問題？", options: ["(A) 定位", "(B) 路徑規劃", "(C) 控制", "(D) 以上皆是"], ans: 3 },
    { q: "56. 下列何者不是移動式機器人？", options: ["(A) 導覽機器人", "(B) 運用肌電訊號啟動的動力外骨骼裝置", "(C) 老人行動輔助器", "(D) 機器化士兵機器人"], ans: 1 },
    { q: "57. 移動式機器人與固定基座工業機器人的最大不同點是", options: ["(A) 移動式機器人的工作空間為無窮大", "(B) 移動式機器人的導航控制技術遠比固定基座工業機器人複雜", "(C) 移動式機器人可選擇合適的移動平台在三度空間中移動", "(D) 以上皆是"], ans: 3 },
    { q: "58. 移動式機器人的移動方式常常模仿自然界生物的運動方式，下列何者不是模仿自然界生物的運動機構？", options: ["(A) 蛇行移動平台", "(B) 腳式移動平台", "(C) 輪型移動平台", "(D) 飛行移動平台"], ans: 2 },
    { q: "59. 輪型移動平台是最具能源效率的移動裝置。下列何者不是常用的輪型移動平台？", options: ["(A) 差速運動平台", "(B) 全方位運動平台", "(C) 獨輪移動平台", "(D) 兩輪自平衡運動平台"], ans: 2 },

        let currentQuiz = [];

        function startQuiz() {
            let num = parseInt(document.getElementById('numQuestions').value);
            if (num > questionBank.length) {
                alert(`目前題庫只有 ${questionBank.length} 題，已為您調整為最大題數。`);
                num = questionBank.length;
            }
            if (num < 1 || isNaN(num)) {
                alert("請輸入有效的題數！");
                return;
            }

            document.getElementById('setupSection').style.display = 'none';
            document.getElementById('quizContainer').style.display = 'block';

            // Fisher-Yates 隨機抽題
            let shuffled = [...questionBank].sort(() => 0.5 - Math.random());
            currentQuiz = shuffled.slice(0, num);

            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById('questionsList');
            container.innerHTML = '';

            currentQuiz.forEach((item, index) => {
                let optionsHtml = '';
                item.options.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <label id="label-q${index}-opt${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}">
                            ${opt}
                        </label>
                    `;
                });

                const questionHtml = `
                    <div class="question-block" id="qBlock${index}">
                        <div class="question-text">第 ${index + 1} 題：${item.q}</div>
                        <div class="options">
                            ${optionsHtml}
                        </div>
                        <div class="result-msg" id="msg${index}"></div>
                    </div>
                `;
                container.innerHTML += questionHtml;
            });
        }

        function submitQuiz() {
            let score = 0;
            let answeredAll = true;

            currentQuiz.forEach((item, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (!selected) {
                    answeredAll = false;
                }
            });

            if (!answeredAll) {
                if (!confirm("⚠️ 您還有未作答的題目，確定要提早交卷嗎？")) {
                    return;
                }
            }

            currentQuiz.forEach((item, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                const msgDiv = document.getElementById(`msg${index}`);
                const correctAnsText = item.options[item.ans];
                
                const radios = document.querySelectorAll(`input[name="q${index}"]`);
                radios.forEach(radio => radio.disabled = true);

                msgDiv.style.display = 'block';

                if (selected && parseInt(selected.value) === item.ans) {
                    score++;
                    msgDiv.innerHTML = "✅ 答對了！";
                    msgDiv.className = "result-msg correct";
                } else {
                    const userAnsText = selected ? item.options[parseInt(selected.value)] : "未作答";
                    msgDiv.innerHTML = `❌ 答錯了！您的答案：${userAnsText}，<br>👉 <strong>正確解答應為：${correctAnsText}</strong>`;
                    msgDiv.className = "result-msg wrong";
                }
            });

            const totalQuestions = currentQuiz.length;
            const finalScore = Math.round((score / totalQuestions) * 100);
            const scoreBoard = document.getElementById('scoreBoard');
            scoreBoard.style.display = 'block';
            
            // 依分數給予不同評語
            let feedback = "";
            if (finalScore >= 90) feedback = "🌟 太神啦！金手獎非你莫屬！";
            else if (finalScore >= 70) feedback = "💪 表現不錯！再複習一下錯題就完美了！";
            else feedback = "📚 沒關係，找出盲點才是模擬測驗的目的，繼續加油！";

            scoreBoard.innerHTML = `測驗結束！您的總得分是：${finalScore} 分 (${score} / ${totalQuestions} 題)<br><span style="font-size: 0.8em; color: #555;">${feedback}</span>`;

            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('retryBtn').style.display = 'block';
            window.scrollTo(0, 0);
        }
    </script>
